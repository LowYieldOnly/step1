# The #1 law, checked on every push and pull request, and every Monday on main.
#
#   "make sure every brody lecture is mapped to third party, and that the sum total videos
#    within a resource are watched in that specific system even if brody does not cover
#    that topic."
#
# The weekly run is the regular check-in: the audit is date-aware (a unit declared to start
# on a date must hold its videos once that date passes), so it can fail with no commit at all.
# GitHub emails on a failed scheduled run.
name: law

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 12 * * 1'   # Mondays, 12:17 UTC
  workflow_dispatch:

jobs:
  audit:
    name: '#1 law audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/law.mjs

  checks:
    name: Playwright checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools
      - run: node run-checks.mjs
        working-directory: tools
