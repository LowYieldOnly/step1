<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7FC">
<script>(function(){try{var s=localStorage.getItem('lyo_theme');var m=(s==='light'||s==='dark')?s:((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',m);var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content',m==='dark'?'#0C0912':'#FAF7FC');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BRODY MODE</title>
<style>
:root{
  color-scheme:light dark;
  /* ============================================================
     THEME — light (white with a whisper of lavender; deep royal
     purple accent, antique-gold hairline accents). Canonical
     tokens use the handoff's names; legacy aliases below keep
     existing rules working. Flat: hairlines, no glass/glow.
     ============================================================ */
  --bg:#FAF7FC; --surface:#FFFFFF; --surface-2:#F1EBF7;
  --text:#171320; --text-2:#544B62; --text-muted:#8B8298;
  --accent:#6A2C9B; --accent-hover:#54217B; --accent-soft:#7E3AB4; --accent-bg:#F0E6F9; --accent-contrast:#FFFFFF;
  --border:#E7DEF0; --border-strong:#D0C3E0; --ring-track:#E7DEF0;
  --gold:#9C7A22; --gold-soft:#F4ECD8;
  --success:#2E6B45; --success-bg:#E7EEE7;
  --warning:#8A5A16; --warning-bg:#F4ECD8;
  --danger:#992D30;  --danger-bg:#F5E4E4;
  --info:#6A2C9B;    --info-bg:#F0E6F9;
  /* subject / category coding (kept for scheduler accents) */
  --cat-blue:#2F6FE0; --cat-teal:#0E9384; --cat-violet:#7C5CFC; --cat-amber:#B45309; --cat-rose:#D6336C; --cat-green:#2C9A5A;
  --scrim:rgba(20,14,28,.5); --toast-bg:#1A1322; --toast-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(30,20,45,.05),0 6px 20px -14px rgba(30,20,45,.16);
  --radius-sm:3px; --radius:5px; --radius-lg:8px;

  /* ---- Legacy aliases → canonical tokens (keeps existing rules working) ---- */
  --surface-base:var(--bg); --surface-raised:var(--surface); --surface-overlay:var(--surface); --surface-sunken:var(--surface-2);
  --text-primary:var(--text); --text-secondary:var(--text-2);
  --bg1:var(--bg); --bg2:var(--surface-2); --soft:var(--surface-2);
  --panel:var(--surface); --panel2:var(--surface-2);
  --ink:var(--text); --muted:var(--text-2); --faint:var(--text-muted);
  --line:var(--border); --line2:var(--border-strong);
  --phos:var(--accent-soft); --phos2:var(--accent-hover); --phos-dim:var(--accent-soft); --phos-soft:var(--accent-bg); --phos-glow:transparent;
  --amber:var(--warning); --amber2:var(--warning); --amber-soft:var(--warning-bg); --amber-glow:transparent;
  --cyan:var(--info); --cyan2:var(--info); --cyan-soft:var(--info-bg); --cyan-glow:transparent;
  --violet:var(--info); --violet-soft:var(--info-bg);
  --red:var(--danger); --red-soft:var(--danger-bg);
  --blue:var(--accent); --blue-soft:var(--accent-bg); --green:var(--success); --navy:var(--toast-bg);
  --on-accent:var(--accent-contrast);
  --r:var(--radius-lg);
  /* ---- Typography (Mulish — warm humanist sans; mono kept for data) ---- */
  --font-ui:"Mulish",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;  /* scholarly serif for big titles */
  --font-read:"Source Serif 4",Georgia,"Times New Roman",serif;  /* long-form only */
  --font-mono:var(--font-ui);  /* full Mulish — mono role folded into the UI font */
  --mono:var(--font-mono); --sans:var(--font-ui);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  /* dark — near-black with a purple undertone, luminous purple
     accent, antique gold. The signature look (Leferi-inspired). */
  --bg:#0C0912; --surface:#161320; --surface-2:#201A2E;
  --text:#F6F3FA; --text-2:#B4ABC4; --text-muted:#7E7590;
  --accent:#A879E6; --accent-hover:#BB93EE; --accent-soft:#B98FEC; --accent-bg:#1E1730; --accent-contrast:#120A1E;
  --border:#282136; --border-strong:#3B3150; --ring-track:#282136;
  --gold:#CBA24E; --gold-soft:#231C12;
  --success:#5FB07C; --success-bg:#16241B;
  --warning:#D2A24E; --warning-bg:#241C10;
  --danger:#DE7A73;  --danger-bg:#2A171A;
  --info:#B98FEC;    --info-bg:#1E1730;
  --cat-blue:#6AA5FF; --cat-teal:#4FD1C5; --cat-violet:#B98FEC; --cat-amber:#F0B24B; --cat-rose:#F472A0; --cat-green:#63C88B;
  --scrim:rgba(4,2,8,.66); --toast-bg:#201A2E; --toast-ink:#F6F3FA;
  --shadow:none;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums slashed-zero;font-feature-settings:"tnum" 1,"zero" 1}
body{padding-bottom:40px;position:relative;min-height:100vh;background:var(--bg)}
/* dark: white blooms bolder — let it breathe a touch */
:root[data-theme="dark"] body{line-height:1.65;letter-spacing:.005em}
/* schedule numbers — times, dates, counts, timers: align + disambiguate */
.tabular{font-variant-numeric:tabular-nums slashed-zero;font-feature-settings:"tnum" 1,"zero" 1}
button{font-family:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:24px 20px 96px}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
b{color:var(--ink)}

/* top bar + nav */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:13px 16px 0;background:color-mix(in srgb,var(--surface-raised) 82%,transparent);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid var(--line)}
.topbar.solo{padding-bottom:13px}
.topbar.solo .topright{margin-left:auto}
.brandbtn{background:none;border:0;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer;padding:12px 10px;margin:-12px -10px;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;border-radius:10px}
.brandbtn .brandnm{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em}
.brandbtn:hover{color:var(--phos)} .brandbtn:hover .brandnm{color:var(--phos)}
.topright{display:flex;align-items:center;gap:11px;flex:0 0 auto;order:1;margin-left:auto}
.led{width:8px;height:8px;border-radius:50%;background:var(--phos-dim)}
.syncchip{display:inline-flex;align-items:center;gap:5px;background:none;border:0;cursor:pointer;padding:8px 6px;margin:-8px -2px;font:600 11px/1 var(--mono,inherit);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-radius:8px;transition:color .15s}
.syncchip:hover{color:var(--ink)}
.syncchip .sdot{width:8px;height:8px;border-radius:50%;background:var(--phos-dim);flex:0 0 auto}
.syncchip .stxt{white-space:nowrap}
@media(max-width:380px){.syncchip .stxt{display:none}}
.syncchip.s-saved .sdot{background:var(--phos)}
.syncchip.s-saving .sdot{background:#d9a441;animation:spulse 1.1s ease-in-out infinite}
.syncchip.s-off .sdot{background:#d9a441}
.syncchip.s-err{color:#e0685f}
.syncchip.s-err .sdot{background:#e0685f}
@keyframes spulse{0%,100%{opacity:.35}50%{opacity:1}}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--phos-dim);flex:0 0 auto}
.sdot.s-saved{background:var(--phos)} .sdot.s-saving{background:#d9a441} .sdot.s-off{background:#d9a441} .sdot.s-err{background:#e0685f}
.bkstatus{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 2px 12px}
.bkbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.iconbtn{background:none;border:0;font-size:21px;color:var(--muted);cursor:pointer;padding:11px 12px;margin:-9px -6px;line-height:1;border-radius:10px;transition:color .15s}
.iconbtn:hover{color:var(--phos)}
/* Tabs share the row evenly when they fit and scroll sideways when they don't
   (six of them no longer fit a 390px phone). flex:1 0 auto is what buys both:
   grow into spare space, but never shrink a label into an ellipsis. */
.nav{order:2;flex:0 0 100%;display:flex;gap:5px;margin:11px -16px 0;padding:8px 16px;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.navb{flex:1 0 auto;white-space:nowrap;background:none;border:0;color:var(--faint);font-weight:600;font-size:14px;letter-spacing:.01em;font-family:var(--sans);padding:12px 8px;cursor:pointer;transition:color .18s,box-shadow .18s}
.navb:hover{color:var(--muted)}
.navb.on{color:var(--phos);box-shadow:inset 0 -2px 0 var(--phos)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin:18px 0}
.card.soft{background:var(--soft);border-color:transparent}
.cardhd{position:relative;font-family:var(--font-display);font-weight:600;font-size:18px;margin-bottom:15px;padding-bottom:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.005em;color:var(--ink);line-height:1.25}
.cardhd::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:2px;border-radius:1px;background:var(--gold);opacity:.9}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--phos);letter-spacing:.09em;text-transform:uppercase}

/* hero */
.hero{position:relative;display:flex;flex-direction:column;background:var(--accent-bg);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin:18px 0;overflow:hidden}
.herorow{display:flex;align-items:center;gap:24px}
.herostat{display:flex;align-items:center;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-size:13px;line-height:1.4;color:var(--text-2)}
.herostat.warn{color:var(--warning)}
.hsdot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--success)}
.herostat.warn .hsdot{background:var(--warning)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none}
.hero-l,.hero-r{position:relative}
.hero .big{font-family:var(--font-display);font-size:40px;font-weight:600;letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.hero .big span{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;text-shadow:none}
.hero .sub{color:var(--muted);font-size:13.5px;margin-top:10px}

/* daily encouragement / wellness nudge (top of Today) */
.cheer{display:flex;align-items:flex-start;gap:11px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.cheer-ic{font-size:19px;line-height:1.45;flex:0 0 auto}
.cheer-tx{font-size:14px;color:var(--ink);line-height:1.5;min-width:0}
.cheer-tx b{color:var(--ink);font-weight:700}
.cheer-by{color:var(--text-2);font-style:italic;white-space:nowrap}
.focusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13.5px;color:var(--text-2)}
.focusbar b{color:var(--ink)}
.focusbar .link{white-space:nowrap}

/* M1 Resource Hub */
.m1wrap{margin-top:4px}
.m1search{margin:14px 0}
.m1search input{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit}
.m1search input:focus{outline:none;border-color:var(--phos);box-shadow:0 0 0 3px var(--phos-soft)}
.m1courses{display:flex;flex-direction:column;gap:10px}
.m1course{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;cursor:pointer;transition:border-color .15s}
.m1course:hover{border-color:var(--phos-dim)}
.m1course-t{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.m1course-n{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--ink)}
.m1course-go{flex:0 0 auto;color:var(--faint);font-size:22px;line-height:1.1;font-weight:400}
.m1course:hover .m1course-go{color:var(--phos)}
.m1course-m{font-size:12.5px;color:var(--muted);margin:3px 0 10px}
.m1coursebar{height:7px}
.m1course-p{font-size:12px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.m1back{background:none;border:none;color:var(--phos);font-family:inherit;font-size:14px;cursor:pointer;padding:10px 0 4px}
.m1cnt{color:var(--muted);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.m1set{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:12px 0 4px}
.m1brick{border-top:1px solid var(--line)}
.m1bh{display:flex;align-items:center;gap:11px;padding:8px 0}
.m1title{flex:1;text-align:left;background:none;border:none;color:var(--ink);font-family:inherit;font-size:14.5px;line-height:1.35;cursor:pointer;padding:2px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.m1t-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.m1chev{flex:0 0 auto;color:var(--faint);font-size:11px;line-height:1;transition:transform .18s ease,color .18s ease}
.m1brick.open .m1chev{transform:rotate(180deg);color:var(--phos)}
.m1brick.done .m1title .m1t-main{color:var(--muted);text-decoration:line-through}
.m1crumb{font-size:11px;color:var(--faint);text-decoration:none}
.m1det{padding:2px 0 14px 35px}
.m1reslist{display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.m1res-k{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--phos);text-transform:uppercase;margin-bottom:6px}
.m1refs{display:flex;flex-direction:column;gap:9px;min-width:0}
.m1grp-h{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 5px;line-height:1.35;word-break:break-word}
.m1grpitems{display:flex;flex-direction:column;gap:5px;padding-left:11px;border-left:2px solid var(--line)}
.m1ref{text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--ink);line-height:1.4;cursor:pointer;font-family:inherit;transition:border-color .15s;word-break:break-word}
.m1ref:hover{border-color:var(--phos-dim)}
.m1acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.m1act{display:inline-block;background:var(--phos-soft);border:1px solid var(--phos-dim);color:var(--phos);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;transition:all .15s}
.m1act:hover{background:var(--phos);color:var(--on-accent)}
.m1lec{font-size:12.5px;color:var(--muted);font-style:italic}
.m1loading,.m1offline{text-align:center;padding:54px 18px}
.m1soon{text-align:center;max-width:30em;margin:44px auto;padding:34px 26px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.m1soon-tag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--phos);background:var(--phos-soft);border:1px solid var(--phos-dim);border-radius:999px;padding:4px 11px;margin-bottom:15px}
.m1soon-t{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--ink);margin-bottom:9px}
.m1soon-d{font-size:14px;color:var(--text-2);line-height:1.6}
/* M1 daily flow planner */
.m1dayhd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin:2px 0 12px}
.m1weeknav{display:flex;align-items:center;gap:8px}
.m1wbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px;line-height:1;cursor:pointer}
.m1wbtn:disabled{opacity:.3;cursor:default}
.m1weeklab{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink);min-width:11em;text-align:center}
.m1assess{font-size:12.5px;color:var(--text-2);background:var(--phos-soft);border:1px solid var(--phos-dim);border-radius:999px;padding:5px 12px}
.m1assess b{color:var(--ink)}
.m1assess.exam{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:color-mix(in srgb,var(--gold) 46%,transparent)}
.m1days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 14px}
.m1daybtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text-2);cursor:pointer;transition:all .14s}
.m1daybtn .m1dow{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.m1daybtn .m1dnum{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ink)}
.m1daybtn .m1ddot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--phos-dim)}
.m1daybtn.today{border-color:var(--phos-dim)}
.m1daybtn.on{background:var(--phos);border-color:var(--phos)}
.m1daybtn.on .m1dow,.m1daybtn.on .m1dnum{color:var(--on-accent,#04140b)}
.m1daybtn.on .m1ddot{background:var(--on-accent,#04140b);opacity:.55}
.m1flow{border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin:0 0 9px;background:var(--panel)}
.m1flow.done{opacity:.62}
.m1fh{display:flex;align-items:flex-start;gap:10px}
.m1badge{flex:0 0 auto;font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:4px 6px;border-radius:6px;margin-top:1px;color:#fff;background:#697}
.m1badge.physio{background:#2f9e7d}.m1badge.anat{background:#c2683a}.m1badge.histo{background:#8a6bd1}
.m1badge.mbom{background:#3b82c4}.m1badge.pharm{background:#c04b8a}.m1badge.fod{background:#6b7a86}.m1badge.clin{background:#a8842f}
.m1ft{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.m1ftitle{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.32}
.m1rx{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--pharm,#c04b8a);border:1px solid currentColor;border-radius:5px;padding:1px 4px;vertical-align:middle}
.m1fcourse{font-size:11.5px;color:var(--text-2)}
.m1kind{margin-left:7px;font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.m1steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 34px}
.m1step{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--bg2,var(--panel));border:1px solid var(--line);border-radius:8px;padding:5px 10px 5px 6px;cursor:pointer;font-family:inherit;transition:border-color .12s}
.m1step:hover{border-color:var(--phos-dim)}
.m1stepbox{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line2,var(--line));display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--on-accent,#04140b);background:transparent}
.m1step.done{color:var(--ink);border-color:var(--phos-dim)}
.m1step.done .m1stepbox{background:var(--phos);border-color:var(--phos)}
.m1fres{margin:9px 0 0 34px}
.m1resvia{display:block;font-size:11px;color:var(--text-2);margin-bottom:6px}
.m1resvia::before{content:"↳ ";opacity:.6}
.m1reslist2{display:flex;flex-direction:column;gap:6px}
.m1resrow{display:flex;align-items:baseline;gap:8px}
.m1reskey{flex:0 0 62px;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-2);padding-top:3px}
.m1resitems{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.m1resmore{font-size:11px;color:var(--faint)}
.m1chips{display:flex;flex-wrap:wrap;gap:6px}
.m1chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg2,var(--panel));color:var(--text-2);cursor:pointer;text-decoration:none;font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m1chip:hover{border-color:var(--phos-dim)}
.m1chip.tag{color:var(--phos);border-color:var(--phos-dim);background:var(--phos-soft)}
.m1chip.rx{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.m1findbtn{font-size:12px;font-weight:600;color:var(--phos);background:none;border:0;padding:2px 0;cursor:pointer;font-family:inherit}
.m1break{display:flex;gap:9px;align-items:center;font-size:12.5px;line-height:1.45;color:var(--text-2);background:color-mix(in srgb,var(--phos) 8%,transparent);border:1px dashed var(--phos-dim);border-radius:11px;padding:10px 13px;margin:13px 0 4px}
.m1break::before{content:"⏸";color:var(--phos);font-size:14px}
/* M1 disclaimer — full-page gate on entry */
.m1disc{max-width:40em;margin:30px auto;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);padding:34px 30px 30px}
.m1disc-eyebrow{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.m1disc-h{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.12;color:var(--ink);margin:0 0 18px}
.m1disc-body p{font-size:15.5px;line-height:1.68;color:var(--text-2);margin:0 0 15px}
.m1disc-body p b{color:var(--ink)}
.m1disc .btn.big{margin-top:10px}
.m1disc-home{display:block;text-align:center;margin:14px auto 0;font-size:13px}
/* M1 persistent notice — apparent on every hub view */
.m1notice{display:flex;align-items:flex-start;gap:11px;background:var(--gold-soft,color-mix(in srgb,var(--gold) 12%,transparent));border:1px solid color-mix(in srgb,var(--gold) 42%,transparent);border-radius:13px;padding:12px 14px;margin:0 0 18px}
.m1notice-i{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1a1206;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.m1notice-t{flex:1;min-width:0;font-size:13px;line-height:1.5;color:var(--text-2)}
.m1notice-t b{color:var(--ink)}
.m1notice-x{flex:0 0 auto;align-self:center;background:none;border:0;color:var(--gold);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;padding:4px 2px;text-decoration:underline}

/* ring (analog gauge) */
.ring{display:block}
.statpct{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px}
.statpct-n{font-family:var(--font-display);font-weight:600;color:var(--ink);line-height:1;letter-spacing:-.01em}
.statpct-n span{font-size:.46em;color:var(--muted);font-weight:500;margin-left:1px}
.statpct-l{font-family:var(--sans);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--faint)}
.ring .rbg{fill:none;stroke:var(--ring-track);stroke-width:6;stroke-dasharray:1.4 5;stroke-linecap:round}
.ring .rfg{fill:none;stroke:var(--phos);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.5,1.4,.4,1)}
.ring .rdot{fill:var(--phos)}
.ring .rtxt{fill:var(--ink);font-family:var(--mono);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:middle}

/* status */
.status{position:relative;border-radius:13px;padding:12px 14px 12px 34px;font-size:13.5px;margin:12px 0;line-height:1.45;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.status::before{content:"";position:absolute;left:14px;top:15px;width:9px;height:9px;border-radius:50%}
.status.ok{background:var(--success-bg);border:1px solid color-mix(in srgb,var(--success) 30%,transparent);color:var(--success)}
.status.ok::before{background:var(--success)}
.status.warn{background:var(--warning-bg);border:1px solid color-mix(in srgb,var(--warning) 32%,transparent);color:var(--warning)}
.status.warn::before{background:var(--warning)}
.status.info{background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);color:var(--info)}
.status.info::before{background:var(--info)}
.pacesvg{width:100%;height:auto;display:block;margin:8px 0 2px;overflow:visible}
.pgrid{stroke:var(--line);stroke-width:1}
.pax{fill:var(--muted);font-family:var(--mono);font-size:8px;letter-spacing:.02em}
.ptoday{stroke:var(--amber);stroke-width:1;stroke-dasharray:2 3;opacity:.85}
.parea{fill:var(--phos-soft);opacity:.45}
.pideal{fill:none;stroke:var(--cyan);stroke-width:1.6;stroke-dasharray:4 3;opacity:.9;stroke-linecap:round;stroke-linejoin:round}
.pactual{fill:none;stroke:var(--phos);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--phos-glow))}
.placeleg{display:flex;gap:18px;justify-content:center;margin:4px 0 2px}
.pl{display:flex;align-items:center;gap:7px;color:var(--muted);font-family:var(--mono);font-size:10.5px}
.pl::before{content:"";width:14px;height:3px;border-radius:2px}
.pl-a::before{background:var(--phos)}
.pl-i::before{background:var(--cyan);opacity:.9}
/* readiness layer UI */
.status.bad{background:var(--danger-bg);border:1px solid color-mix(in srgb,var(--danger) 32%,transparent);color:var(--danger)}
.status.bad::before{background:var(--danger)}
.hchips{margin:10px 0 0}
.hcav{margin:6px 0 0}
.rchip{display:inline-flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:12px;padding:10px 13px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-family:inherit;font-size:12.5px;cursor:pointer;transition:border-color .15s}
.rchip:hover{border-color:var(--phos-dim)}
.rchip-n{font-family:var(--mono);font-weight:700;font-size:16px}
.rchip-t{color:var(--muted)}
.rchip-ok .rchip-n{color:var(--phos)}
.rchip-warn .rchip-n{color:var(--amber)}
.rchip-bad .rchip-n{color:var(--red)}
.rchip-info{justify-content:center;color:var(--cyan)}
.form2{display:flex;flex-direction:column;gap:10px}
.form2 label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.form2 input,.form2 select{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
.form2 input:focus,.form2 select:focus{outline:none;border-color:var(--phos);box-shadow:0 0 0 3px var(--phos-soft)}
.form2 .opt{font-weight:500;color:var(--faint);text-transform:none;letter-spacing:0}
.alist{display:flex;flex-direction:column;gap:1px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 3px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.adot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--faint)}
.adot.ok{background:var(--phos)}
.adot.warn{background:var(--amber)}
.adot.bad{background:var(--red)}
.adot.info{background:var(--cyan)}
.aform{flex:1;min-width:0;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apct{font-family:var(--mono);font-weight:700;font-size:14px}
.adate{font-family:var(--mono);font-size:11px;color:var(--faint)}
.alink{background:none;border:0;color:var(--faint);font-size:11px;cursor:pointer;padding:2px 4px;font-family:inherit}
.alink:hover{color:var(--red)}
.uwtop{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px}
.uwbig{font-family:var(--mono);font-weight:700;font-size:26px;color:var(--phos)}
.uwbig span{font-size:12px;color:var(--muted);font-weight:600}
.uwsub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.uwhd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:12px 0 6px}
/* Step 1 readiness snapshot + qbank overall progress */
.readysnap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.rtile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
.rtile-v{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--ink);line-height:1.1}
.rtile-l{font-size:11px;color:var(--text-2);margin-top:3px}
.rtile.ok{border-color:color-mix(in srgb,var(--success) 55%,transparent)}.rtile.ok .rtile-v{color:var(--success)}
.rtile.warn{border-color:color-mix(in srgb,var(--warning) 55%,transparent)}.rtile.warn .rtile-v{color:var(--warning)}
.rtile.bad{border-color:color-mix(in srgb,var(--danger) 55%,transparent)}.rtile.bad .rtile-v{color:var(--danger)}
.rtile.info .rtile-v{color:var(--phos)}
.uwprog{margin:0 0 12px}
.uwprog .uwproglab{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:5px}
.uwprog .uwproglab b{color:var(--ink);font-family:var(--mono)}
.wgcard .wgrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.wgcard .wglab{font-size:12.5px;color:var(--text-2)}
.wgcard .wgn{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink)}
.wgcard .wgn.met{color:var(--success)}
.wgtoggle{display:flex;align-items:center;gap:10px}
.uwprog .uwproglab .wgmet{color:var(--success);font-weight:700}
.barfill.over{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:14px 14px}
.wgcard .wgstatus{font-size:12px;color:var(--text-2);margin:8px 0 0}
.wgcard .wgstatus b{color:var(--ink);font-family:var(--mono)}
.wgcard .wgstatus.met,.wgcard .wgstatus.met b{color:var(--success)}
.wqlog{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wqlog .wqsel,.wqlog .wqnum{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12.5px}
.wqlog .wqsel{flex:1;min-width:84px}
.wqlog .wqnum{width:74px;flex:0 0 auto}
.wqlog .wqbtn{padding:6px 15px;font-size:12.5px;flex:0 0 auto}
.bartrack.big{height:11px}
.flagb{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.5px solid transparent;background:none;color:var(--faint);font-size:13px;cursor:pointer;transition:all .15s}
.flagb:hover{color:var(--amber);border-color:var(--line2)}
.flagb.on{color:var(--warning);border-color:var(--warning);background:var(--warning-bg)}
.vrow.shaky .vn{border-color:var(--amber)!important}

/* video list */
.vlist{display:flex;flex-direction:column;gap:5px}
.vgrp{margin-bottom:4px}
.vgrp .vghdr{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:4px 0 6px}
.vrow{display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:11px;transition:background .15s}
.vrow:hover{background:var(--surface-sunken)}
.mfoot{text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);padding:8px 0 4px;letter-spacing:.04em;opacity:.7}
.vrow.done .vn{opacity:.45;text-decoration:line-through}
.vrow.done .vmin{opacity:.4}
.chk{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);background:var(--bg2);color:var(--on-accent);font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .16s}
.chk:hover{border-color:var(--phos-dim)}
.chk.on{background:var(--phos);border-color:var(--phos)}
.vmeta{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.vn{font-size:14px;border-left:3px solid var(--border-strong);padding-left:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.cpy{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cpy:hover{color:var(--phos);border-color:var(--phos-dim)}
.vmin{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 auto;padding-left:6px}
/* qualified row: category sits on its own line under the name (see rowQualifiers) */
.vnq{display:flex;flex-direction:column;gap:1px;min-width:0;flex:0 1 auto}
.vnq .vn{max-width:100%}
.vq{font-size:11px;line-height:1.25;color:var(--faint);padding-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vrow.done .vq{opacity:.45;text-decoration:line-through}
.badge{display:inline-block;font-size:9px;font-weight:800;padding:2px 5px;border-radius:5px;color:var(--on-accent)}
.badge.bnb{background:var(--phos)}.badge.pa{background:var(--violet)}.badge.sk{background:var(--amber)}.badge.bc{background:var(--gold)}
.anki{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ankicard .anki{margin-top:0;padding-top:0;border-top:0}
.akmeta{display:flex;flex-direction:column;min-width:0;flex:1}
.aklab{font-size:13.5px;font-weight:700}
.akcount{font-family:var(--mono);font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.cpyall{flex:0 0 auto;background:var(--phos-soft);border:1px solid var(--phos-dim);color:var(--phos);border-radius:10px;padding:8px 13px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:all .15s}
.cpyall:hover{background:var(--phos);color:var(--on-accent)}
.aktags{margin-top:10px}
.aktags>summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--phos);padding:5px 0;text-transform:uppercase;letter-spacing:.05em}
.aktags>summary::-webkit-details-marker{display:none}
.aktags>summary::before{content:"▸ ";color:var(--faint)}
.aktags[open]>summary::before{content:"▾ "}
.aktagsec{margin-top:11px}
.aktaghd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.aktagreslab{font-size:12.5px;font-weight:700;color:var(--ink)}
.aktagreslab .akn{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.cpyres{flex:0 0 auto;background:var(--phos-soft);border:1px solid var(--phos-dim);color:var(--phos);border-radius:9px;padding:5px 11px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.cpyres:hover{background:var(--phos);color:var(--on-accent)}
.aktaglist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.aktagrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;transition:border-color .14s}
.aktagrow:hover{border-color:var(--phos-dim)}
.aktagname{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aktagrow:hover .aktagname{color:var(--ink)}
.aktagcopy{flex:0 0 auto;color:var(--phos);font-size:13px}

.rowtools{margin-top:14px;display:flex;gap:8px}
.habits{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.habits li{margin:5px 0}

/* month calendar */
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.calnav{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-size:18px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .15s}
.calnav:hover{border-color:var(--phos-dim);color:var(--phos)}
.calmon{font-family:var(--mono);font-weight:700;font-size:15px;flex:1;text-align:center;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.caltoday{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--phos);background:var(--phos-soft);border:1px solid var(--phos-dim);border-radius:10px;padding:9px 12px;cursor:pointer;transition:all .15s}
.caltoday:hover{background:var(--phos);color:var(--on-accent)}
.calwk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.calwk div{text-align:center;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calcell{aspect-ratio:1/1;border:1px solid var(--line);background:var(--surface-sunken);border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 2px;gap:3px;position:relative;overflow:hidden;transition:transform .1s,border-color .15s,background .15s}
.calcell:not(.empty):hover{border-color:var(--line2)}
.calcell.empty{border:0;background:transparent;cursor:default}
.calcell .cd{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);line-height:1}
.calcell .ci{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--muted);line-height:1;letter-spacing:.02em}
.calcell.past{opacity:.35}.calcell.past .cd{color:var(--muted)}
.calcell.earlier{opacity:.7;background:var(--soft);border-style:dashed;border-color:var(--line2)}
.calcell.earlier .cd{color:var(--muted)}.calcell.earlier .ci{color:var(--faint)}
.pill.earlier{background:var(--soft);color:var(--faint)}
.calcell.load{background:var(--phos-soft);border-color:var(--line2)}.calcell.load .ci{color:var(--phos)}
.calcell.alldone{background:var(--accent-bg);border-color:var(--accent)}.calcell.alldone .ci{color:var(--accent);font-size:12px}
.calcell.rest,.calcell.off{background:var(--warning-bg)}.calcell.rest .ci,.calcell.off .ci{color:var(--amber)}
.calcell.review{background:var(--info-bg);border-color:var(--info)}.calcell.review .ci{color:var(--violet)}
.cvlist{display:none}   /* per-day video titles — only shown in the big (desktop) calendar */
.calcell.today{border-color:transparent;box-shadow:0 0 0 1.5px var(--phos) inset}
.calcell.sel{box-shadow:0 0 0 2px var(--ink) inset;border-color:transparent;animation:none}
.callegend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 2px 4px;font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend .lg{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid var(--line2)}
.callegend .lg.load{background:var(--phos-soft)}
.callegend .lg.alldone{background:var(--accent-bg);border-color:var(--accent)}
.callegend .lg.rest{background:var(--warning-bg)}
.callegend .lg.review{background:var(--info-bg);border-color:var(--info)}
.callegend .lg.off{background:var(--warning-bg)}
.daydetail{margin-top:18px}

/* progress bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:10px}
.barlab{flex:0 0 42%;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{flex:1;height:8px;background:var(--bg2);border-radius:999px;overflow:hidden}
.barfill{height:100%;border-radius:999px;background:var(--accent);transition:width .5s cubic-bezier(.5,1.2,.4,1)}
.barpct{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--muted);width:38px;text-align:right}
/* the lowest-accuracy systems in the focus card — emphasis by rank, not by a pass mark */
.bar.focus .barlab{font-weight:700;color:var(--ink)}
.bar.focus .barfill{background:var(--phos)}
.barpct.conf{width:80px;flex:0 0 80px;line-height:1.2}
.barpct.conf b{color:var(--ink);font-weight:700}
/* master checklist */
.clwrap{max-width:800px;margin:0 auto}
.clhead .cltop{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 9px}
.clbig{font-size:26px;font-weight:800;color:var(--ink)}
.clbig span{font-size:14px;color:var(--muted);font-weight:600}
.clpct{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--phos)}
.clpct.met{color:var(--success)}
.clres{padding:0;overflow:hidden}
.clfold>summary{list-style:none;cursor:pointer}
.clfold>summary::-webkit-details-marker{display:none}
.clsum{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.clreslab{font-size:15px;font-weight:800;color:var(--ink)}
.clreslab::before{content:"▸ ";color:var(--faint);font-size:12px}
.clfold[open]>summary .clreslab::before{content:"▾ "}
.clprog{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.clfrac{font-family:var(--mono);font-size:12px;color:var(--muted)}
.clfrac.met{color:var(--success)}
.clmini{width:82px;height:6px;background:var(--bg2);border-radius:999px;overflow:hidden}
.clminifill{display:block;height:100%;background:var(--phos);border-radius:999px}
.clsys{padding:0 16px 6px}
.clsyshd{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 6px}
.clcat{font-size:12px;color:var(--faint);margin:9px 0 4px}
.cllist{display:flex;flex-direction:column;gap:5px}
.clrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;transition:border-color .14s}
.clrow:hover{border-color:var(--phos-dim)}
.clchk{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--on-accent)}
.clchk.on{background:var(--phos);border-color:var(--phos)}
.clname{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clrow.done .clname{text-decoration:line-through;color:var(--faint)}
.clmin{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* forms / toggles */
.form{display:flex;flex-direction:column;gap:13px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.form input{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:12px;font-size:15px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.form input:focus{outline:none;border-color:var(--phos);box-shadow:0 0 0 3px var(--phos-soft)}
.datebtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:12px;font-size:15px;font-family:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.datebtn:hover{border-color:var(--phos-dim)}
.datebtn:focus-visible{outline:none;border-color:var(--phos);box-shadow:0 0 0 3px var(--phos-soft)}
.datebtn .dim{color:var(--faint)}
.datebtn-ic{color:var(--phos);font-size:11px;opacity:.8}
.dpsheet{max-width:360px}
.dpnav{display:flex;align-items:center;gap:6px;padding:12px 14px 4px}
.dpnavbtn{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line2);background:var(--bg2);color:var(--phos);border-radius:10px;font-size:18px;line-height:1;cursor:pointer;font-family:var(--mono);transition:background .15s,border-color .15s}
.dpnavbtn:hover{background:var(--phos-soft);border-color:var(--phos-dim)}
.dpym{flex:1;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;height:38px;cursor:pointer;transition:background .15s,border-color .15s}
.dpym:hover,.dpym.open{background:var(--phos-soft);border-color:var(--phos-dim)}
.dpym i{font-style:normal;font-size:11px;color:var(--faint);margin-left:3px}
.dpjump{padding:10px 14px 6px}
.dpyears{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.dpyr{flex:0 0 auto;min-width:58px;height:34px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:9px;font-family:var(--mono);font-size:14px;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s}
.dpyr:hover{background:var(--phos-soft);border-color:var(--phos-dim)}
.dpyr.on{background:var(--phos);color:var(--on-accent);border-color:var(--phos)}
.dpmonths{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dpmo{height:42px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:9px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s}
.dpmo:hover:not(:disabled){background:var(--phos-soft);border-color:var(--phos-dim)}
.dpmo.on{background:var(--phos);color:var(--on-accent);border-color:var(--phos)}
.dpmo:disabled{opacity:.3;cursor:default}
.dpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 14px 6px}
.dpdow{text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);padding:3px 0;text-transform:uppercase;letter-spacing:.06em}
.dpcell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:var(--bg2);color:var(--ink);border-radius:9px;font-size:14px;font-family:var(--mono);cursor:pointer;transition:background .12s,border-color .12s}
.dpcell:hover:not(.off){background:var(--phos-soft);border-color:var(--phos-dim)}
.dpcell.empty{background:none;border:0;cursor:default}
.dpcell.off{color:var(--faint);opacity:.3;cursor:default}
.dpcell.today{border-color:var(--cyan)}
.dpcell.sel{background:var(--phos);color:var(--on-accent);border-color:var(--phos);font-weight:700}
.flab{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.togrow{display:flex;flex-wrap:wrap;gap:7px}
.tog{background:var(--bg2);border:1px solid var(--line2);color:var(--muted);border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:all .14s}
.tog:hover{color:var(--ink)}
.tog:active{transform:scale(.97)}
.tog.on{background:var(--phos-soft);border-color:var(--phos-dim);color:var(--phos)}
.sysgrid .tog{font-size:12px;padding:7px 10px}
.mt{margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.kv{font-family:var(--mono);font-size:25px;font-weight:700;color:var(--phos)}
.kvl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* buttons */
.btn{background:var(--accent);border:0;color:var(--on-accent);font-weight:700;font-size:15px;padding:14px 18px;border-radius:var(--radius);cursor:pointer;width:100%;letter-spacing:.01em;transition:transform .08s,background .18s}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);width:auto;font-weight:600}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.big{padding:16px;font-size:16px;margin-top:8px}
.btn.sm{padding:8px 14px;font-size:13px;width:auto;flex:0 0 auto}
.pulist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.purow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px}
.pumeta{display:flex;flex-direction:column;gap:2px;min-width:0}
.pureopen{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--phos);white-space:nowrap}
.purow2{display:flex;align-items:stretch;gap:4px}
.purow2main{flex:1;min-width:0}
.pudel{flex:0 0 auto;background:none;border:0;color:var(--muted);font-size:15px;cursor:pointer;padding:0 14px;border-radius:12px;line-height:1}
.pudel:hover{color:#e0685f;background:var(--line)}
.pumeta b{font-size:14px}
.pumeta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{background:none;border:0;color:var(--phos);font-weight:700;cursor:pointer;padding:0;font-size:inherit;transition:color .15s}
.link:hover{color:var(--phos2)}
.link.block{display:block;width:100%;text-align:center;margin-top:10px;padding:8px}

/* onboarding */
.onb{max-width:560px}
.onboard{animation:fadeUp .45s ease both}
.onboard h1{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:0;margin:10px 0 2px;line-height:1.1}

/* welcome / hub chooser */
.welcomewrap{max-width:560px;padding-top:46px}
.welcome{text-align:center;animation:fadeUp .5s ease both}
.wbrand{font-family:var(--font-display);font-weight:500;font-size:clamp(30px,8.6vw,44px);letter-spacing:0;line-height:1.04;color:var(--accent-soft);text-transform:none}
.wtag{color:var(--muted);margin:13px 0 28px;font-size:13px;font-family:var(--mono);letter-spacing:.02em}
.wservire{display:flex;align-items:center;justify-content:center;gap:15px;margin:8px 0 30px}
.wservire span{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:24px;color:var(--text-2);letter-spacing:.05em}
.wservire::before,.wservire::after{content:"";height:1px;width:42px;background:linear-gradient(to var(--_d,right),transparent,var(--gold))}
.wservire::after{--_d:left}
.hubs{display:flex;flex-direction:column;gap:16px}
/* hover/active = border tint only — no transform. A transform promotes the
   card to its own layer over the transparent welcome page, which re-rasterizes
   the fixed aurora gradient and flashes the background hue on hover. */
.hubcard{position:relative;display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;overflow:hidden;transition:border-color .2s}
.hubcard:hover{border-color:var(--phos-dim)}
@media (hover:hover){.calcell:not(.empty):hover{transform:translateY(-1px)}}
.hubcard:active{border-color:var(--phos-dim)}
.hubtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hubname{font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:0;color:var(--ink)}
.hubcard.soon{cursor:default;opacity:.62}
.hubcard.soon:hover{border-color:var(--line);transform:none}
.soontag{font-family:var(--sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);border:1px solid var(--border-strong);border-radius:4px;padding:3px 8px;white-space:nowrap}
.hubsub{color:var(--muted);font-size:12px;margin-top:10px;font-family:var(--mono);letter-spacing:.01em}
.hubgo{margin-top:14px;font-size:11px;font-weight:700;color:var(--phos);text-transform:uppercase;letter-spacing:.11em;font-family:var(--mono)}
.wfoot{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:9px}
.wfoot .acct{color:var(--faint);font-size:12px;font-family:var(--sans);letter-spacing:.01em}
.wfootlink{background:none;border:0;padding:2px 4px;color:var(--text-2);font-family:var(--sans);font-size:12.5px;font-weight:500;letter-spacing:.01em;cursor:pointer;transition:color .15s}
.wfootlink:hover{color:var(--accent-soft)}
/* About page */
.about{max-width:520px;margin:0 auto;text-align:center;padding-bottom:44px}
.about .m1back{display:block;text-align:left;margin-bottom:16px}
.about-brand{font-size:clamp(28px,7.5vw,40px);margin-top:4px}
.about-lead{font-family:var(--font-display);font-style:italic;font-size:clamp(17px,4.4vw,21px);color:var(--text-2);line-height:1.5;margin:8px auto 18px;max-width:24em}
.about-intro{font-size:14.5px;color:var(--text-2);line-height:1.65;margin:0 auto 30px;max-width:27em}
.about-sec{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.about-credits{display:flex;flex-direction:column;gap:16px;text-align:left;margin:0 auto 30px;max-width:27em}
.credit{border-left:2px solid var(--gold);padding-left:14px}
.credit-role{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--phos);margin-bottom:5px}
.credit-name{font-size:14.5px;color:var(--ink);line-height:1.5}
.credit-cls{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.about-goal{font-size:14.5px;color:var(--text-2);line-height:1.65;max-width:27em;margin:0 auto}
.credit.pending{border-left-style:dashed;border-left-color:var(--line2)}
.credit-name.soon{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.credit-soon{font-size:11.5px;font-style:italic;color:var(--muted);margin-top:3px}
.members{display:flex;flex-direction:column;gap:13px;margin-top:11px}
.member{display:flex;align-items:center;gap:13px}
.credit-photo{flex:0 0 auto;width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--faint);letter-spacing:.02em}
.credit-photo img{width:100%;height:100%;object-fit:cover;display:block}
.credit-photo.empty{border-style:dashed;background:transparent}
.member-info{min-width:0}
.member-name{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.35}
.member-name.soon{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}

/* ordered systems (reorderable) */
.sysord{display:flex;flex-direction:column;gap:6px;margin:10px 0 8px}
.sysrow{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:7px 9px;opacity:.5;transition:opacity .14s,border-color .14s,background .14s}
.sysrow.on{opacity:1;background:var(--surface-sunken)}
.sysinc{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);background:transparent;color:var(--on-accent);font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s}
.sysrow.on .sysinc{background:var(--phos);border-color:var(--phos)}
.qzrow{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:8px 0}
.qzhd{display:flex;align-items:center;gap:8px}
.qzdate{flex:0 0 auto;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--phos);background:var(--phos-soft);border:1px solid var(--phos-dim);border-radius:9px;padding:6px 10px;cursor:pointer}
.qzlab{flex:1;min-width:0;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.qzdel{flex:0 0 auto;width:28px;height:28px;border:none;background:none;color:var(--faint);font-size:14px;cursor:pointer;border-radius:8px}
.qzdel:hover{color:var(--danger);background:var(--surface-2)}
.qzstat{font-size:12px;line-height:1.45;color:var(--text-2);margin-top:8px}
.qzstat.ok{color:var(--success)}
.qzstat.warn{color:var(--warning)}
.qztoggle{display:block;margin-top:8px;font-size:12px;font-weight:700;color:var(--text-2);background:none;border:none;padding:2px 0;cursor:pointer;text-align:left}
.qzpick{margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
.qzsys{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.qzsysall{width:20px;height:20px;flex:0 0 auto;border:1.5px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--on-accent);font-size:11px;cursor:pointer}
.qzsysall.on{background:var(--phos);border-color:var(--phos)}
.qzsysnm{font-size:12.5px;font-weight:700;color:var(--ink)}
.qzcats{display:flex;flex-wrap:wrap;gap:5px;margin-left:28px}
.qzcat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text-2);cursor:pointer}
.qzcat.on{border-color:var(--phos);background:var(--phos-soft);color:var(--phos);font-weight:700}
.catdis{transition:transform .12s ease}
.catdis.open{transform:rotate(90deg)}
.catord{margin:0 0 8px 34px;padding:8px 10px;border-left:2px solid var(--line);border-radius:0 8px 8px 0;background:var(--surface-2)}
.catgrp+.catgrp{margin-top:10px}
.catreslab{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:4px}
.catrow{display:flex;align-items:center;gap:8px;padding:2px 0}
.catnm{flex:1;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysnm{flex:1;min-width:0;font-size:13.5px;border-left:3px solid;padding-left:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordbtns{flex:0 0 auto;display:flex;gap:4px}
.ordbtn{width:30px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font-size:12px;cursor:pointer;transition:all .14s}
.ordbtn:hover:not([disabled]){color:var(--phos);border-color:var(--phos-dim)}
/* Pathoma chapter picker */
.pathlist{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px}
.pathrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer;opacity:.5;font-family:inherit;transition:opacity .14s,border-color .14s,background .14s}
.pathrow.on{opacity:1;background:var(--surface-sunken)}
.pathinc{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);background:transparent;color:var(--on-accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .14s}
.pathrow.on .pathinc{background:var(--phos);border-color:var(--phos)}
.pathnm{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pathsys{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--faint);white-space:nowrap}
/* psych / ethics section picker */
.card.threadwarn{border-color:color-mix(in srgb,var(--warning) 55%,transparent);background:var(--warning-bg)}
.thbadge{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warning);border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);border-radius:6px;padding:2px 6px}
.threadprompt{font-size:12.5px;line-height:1.45;color:var(--warning);margin:0 0 4px}
.threadbtns{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.threadbtns .thsep{color:var(--faint)}
.threadhd{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;text-align:left;background:transparent;border:none;cursor:pointer;padding:9px 2px 4px;font-family:inherit}
.thcatnm{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink);min-width:0}
.thcatct{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:800;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.thcatct.on{color:var(--phos);border-color:color-mix(in srgb,var(--phos) 45%,transparent)}
/* recommended-pace banner (custom schedule editor) */
.pacebanner{border-radius:14px;padding:14px 15px;margin:2px 0 14px;border:1px solid var(--line)}
.pacebanner.ok{background:color-mix(in srgb,var(--success) 9%,var(--surface));border-color:color-mix(in srgb,var(--success) 32%,transparent)}
.pacebanner.warn{background:var(--warning-bg);border-color:color-mix(in srgb,var(--warning) 38%,transparent)}
.pbtop{display:flex;align-items:center;gap:13px}
.pbnum{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;color:var(--ink);white-space:nowrap}
.pbnum i{font-style:normal;font-size:14px;font-weight:700;color:var(--faint);margin-left:3px}
.pblab{display:flex;flex-direction:column;gap:2px;min-width:0}
.pblab b{font-size:14.5px;color:var(--ink);letter-spacing:-.01em}
.pblab span{font-size:12px;color:var(--text-2);line-height:1.35}
.pbstat{font-size:12.5px;line-height:1.45;color:var(--text-2);margin-top:10px}
.pbok,.pbwarn{font-weight:800;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:6px;margin-right:6px}
.pbok{color:var(--success);background:color-mix(in srgb,var(--success) 15%,transparent)}
.pbwarn{color:var(--warning);background:color-mix(in srgb,var(--warning) 18%,transparent)}
.pbbtn{margin-top:11px;width:100%}
.pbbuf{font-size:12.5px;line-height:1.45;color:var(--text-2);margin-top:9px;padding-top:9px;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.pbbuf b{color:var(--ink)}
.pbnote{font-size:12px;line-height:1.45;color:var(--text-2);margin-top:10px;padding:8px 11px;border-radius:9px;background:color-mix(in srgb,var(--phos) 10%,transparent);border:1px dashed color-mix(in srgb,var(--phos) 45%,transparent)}
.pbnote b{color:var(--ink)}
.calhelp{flex:0 0 auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--phos);background:var(--phos-soft);border:1px solid var(--phos-dim);border-radius:50%;cursor:pointer;transition:all .15s}
.calhelp:hover{background:var(--phos);color:var(--on-accent)}
.srcsplit{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.02em;color:var(--faint);margin-left:5px;white-space:nowrap}
.rtile-s{display:block;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.02em;color:var(--faint);margin-top:2px;text-transform:none}
/* Plan tab landing menu */
.planmenu{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:13px}
.pmhd{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.01em;color:var(--ink);margin:4px 0 6px}
.pmback{align-self:flex-start;margin-bottom:2px}
.pmcard{display:flex;align-items:center;gap:15px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s,transform .06s}
.pmcard:hover:not(.disabled){border-color:var(--phos-dim);background:var(--phos-soft)}
.pmcard:active:not(.disabled){transform:scale(.994)}
.pmcard.disabled{opacity:.5;cursor:default}
.pmc-ic{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px}
.pmc-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pmc-t{font-size:16px;font-weight:650;color:var(--ink);letter-spacing:-.005em}
.pmc-s{font-size:12.5px;color:var(--text-2);line-height:1.4}
.pmc-arrow{flex:0 0 auto;font-size:22px;color:var(--faint);font-family:var(--mono)}
/* content audit (leads) */
.ca-flag{border:1px solid color-mix(in srgb,var(--warning) 40%,transparent);background:var(--warning-bg);border-radius:11px;padding:11px 12px;margin:10px 0}
.ca-flaghd{font-size:12.5px;font-weight:800;color:var(--warning);margin-bottom:7px}
.ca-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);padding:3px 0;line-height:1.35}
.ca-row.mono{font-family:var(--mono);font-size:11px;color:var(--text-2);word-break:break-all}
.ca-sc{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint);white-space:nowrap}
.ca-wk{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.ca-wkhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ca-wkn{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--phos);background:var(--phos-soft);border-radius:6px;padding:2px 8px}
.ca-wklab{font-family:var(--font-display);font-weight:650;font-size:15px;color:var(--ink)}
.ca-wkct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.ca-lects{background:var(--phos-soft);border-radius:8px;padding:9px 12px;margin:2px 0 10px}
.ca-lecthd{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--phos);margin-bottom:6px}
.ca-lectgrp{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin:6px 0;align-items:start}
.ca-lectdisc{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--phos);background:color-mix(in srgb,var(--phos) 14%,transparent);border-radius:5px;padding:2px 6px;justify-self:start;white-space:nowrap}
.ca-lect{font-size:12.5px;color:var(--ink);line-height:1.5}
.ca-lect.muted{color:var(--faint);font-style:italic}
.ca-resgrp{margin:8px 0 4px}
.ca-reslab{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-2);margin:6px 0 3px;cursor:pointer;list-style:none;user-select:none;padding:3px 0}
.ca-reslab::-webkit-details-marker{display:none}
.ca-reslab::before{content:"▸";color:var(--faint);font-size:9px;line-height:1;transition:transform .12s ease}
details.ca-resgrp[open]>.ca-reslab::before{transform:rotate(90deg)}
.ca-resct{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--faint)}
.ca-reslab:hover{color:var(--ink)}
.ca-cat{margin:0 0 5px 4px}
.ca-catnm{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);margin:4px 0 2px}
.ca-v{font-size:12.5px;color:var(--ink);line-height:1.45;padding:1px 0 1px 10px;border-left:2px solid var(--line)}
.ca-v.def{border-left-color:var(--warning);color:var(--warning)}
.ca-deftag{font-family:var(--mono);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--warning);border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);border-radius:5px;padding:0 5px;margin-left:5px}
/* rapid reference — collapsible section › video › topic › points */
.rrbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 6px}
.rrsearch{position:relative;flex:1 1 260px;min-width:200px}
.rrsearch input{width:100%;padding:10px 34px 10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);font-family:var(--sans);font-size:14px}
.rrsearch input::placeholder{color:var(--faint)}
/* type=search keeps the phone keyboard's Search key, but its native × would sit
   next to ours — two clear buttons in one field */
.rrsearch input::-webkit-search-cancel-button,.rrsearch input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.rrsearch input:focus{outline:2px solid var(--phos);outline-offset:1px;border-color:var(--phos)}
.rrclear{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--faint);cursor:pointer;font-size:17px;line-height:1;padding:6px 8px;border-radius:4px}
.rrclear:hover{color:var(--ink)}
.rrhits{font-size:12px;color:var(--faint);margin:0 0 14px;min-height:16px}
.rrsec{margin:0 0 26px}
.rrsechd{display:flex;align-items:baseline;gap:11px;padding:0 0 8px;border-bottom:2px solid var(--phos);margin-bottom:2px}
.rrsechd h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--phos)}
.rrct{font-size:11px;color:var(--faint);letter-spacing:.05em;margin-left:auto}
.rrv{border-bottom:1px solid var(--line)}
.rrvb{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:12px 4px;font-family:var(--sans);font-size:15px;font-weight:700}
.rrvb:hover{color:var(--phos)}
.rrvb:focus-visible{outline:2px solid var(--phos);outline-offset:-2px}
.rrcar{flex:none;width:8px;height:8px;border-right:2px solid var(--phos);border-bottom:2px solid var(--phos);transform:rotate(-45deg);transition:transform .16s ease;margin-left:3px}
.rrv.open>.rrvb .rrcar{transform:rotate(45deg)}
.rrvn{flex:1 1 auto}
.rrv.done .rrvn{color:var(--text-2)}
.rrdone{flex:none;color:var(--success);font-size:12px;font-weight:800}
.rrvmeta{flex:none;font-size:10.5px;color:var(--faint);letter-spacing:.04em;white-space:nowrap}
.rrvbody{padding:2px 0 16px 20px}
.rrt{border-left:1px solid var(--line);padding-left:14px;margin-bottom:2px}
.rrtb{width:100%;display:flex;align-items:baseline;gap:8px;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:7px 2px;font-family:var(--sans);font-size:13.5px;font-weight:600}
.rrtb:hover{color:var(--phos)}
.rrtb:focus-visible{outline:2px solid var(--phos);outline-offset:-2px}
.rrdot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--phos);position:relative;top:-1px}
.rrt.open>.rrtb .rrdot{background:transparent;box-shadow:inset 0 0 0 2px var(--phos)}
ul.rritems{list-style:none;margin:0;padding:1px 0 9px 14px}
ul.rritems li{position:relative;padding:3.5px 0 3.5px 14px;color:var(--text-2);font-size:13px;line-height:1.5}
ul.rritems li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:1px;background:var(--line2)}
.rrempty{color:var(--faint);font-size:13.5px;padding:18px 0}
/* extra resources — tap-to-reveal diagnostic algorithms.
   The four box colours are a legend, not decoration, so they keep their meaning
   (finding / next step / diagnosis / management) while being re-toned to the
   app's palette. Dark-mode values ride the same tokens. */
/* M3 hub: shelf and unit cards */
.m3grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:14px 0 26px}
.m3card{text-align:left;font:inherit;font-family:var(--sans);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 17px;cursor:pointer;display:flex;flex-direction:column;gap:5px;color:var(--ink);
  transition:border-color .14s,box-shadow .14s}
.m3card:hover{border-color:var(--phos);box-shadow:var(--shadow)}
.m3card:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
.m3card.soon{cursor:default;background:var(--surface-2);border-style:dashed;opacity:.72}
.m3card.soon:hover{border-color:var(--line);box-shadow:none}
.m3top{display:block}
/* the tag always sits under the name, so a one-word shelf and a two-line one line up */
.m3top .soontag{display:inline-block;margin-top:7px}
.m3name{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.m3sub{font-size:12.5px;color:var(--text-2)}
.m3card .hubgo{margin-top:4px;font-size:12px;font-weight:700;color:var(--phos)}
.m3crumb{font-size:11.5px;color:var(--faint);letter-spacing:.04em;margin:2px 0 -4px}
.exbanner{display:flex;align-items:baseline;gap:11px;padding:0 0 8px;border-bottom:2px solid var(--phos);margin:6px 0 14px}
.exbanner h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--phos)}
.exbanner .exct{font-size:11.5px;color:var(--faint);margin-left:auto}
.expick{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.exbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.extick{font-size:12px;color:var(--faint);margin-left:auto}
.exzoom{display:flex;align-items:center;gap:5px}

.exzlab{font-size:11.5px;color:var(--faint);min-width:40px;text-align:center}
/* the zoom controls matter MORE on a phone, not less */
.exhint{font-size:12.5px;color:var(--text-2);margin:0 0 14px;max-width:64ch}
.excanvas{overflow-x:auto;overflow-y:hidden;padding:6px 0 18px;-webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.exsizer{position:relative}
.exstage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.extree ul{position:relative;display:flex;justify-content:center;list-style:none;margin:0;padding:22px 0 0}
.extree>ul{padding-top:0}
.extree li{position:relative;display:flex;flex-direction:column;align-items:center;padding:22px 5px 0}
.extree li::before,.extree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:1.5px solid var(--line2)}
.extree li::after{right:auto;left:50%;border-left:1.5px solid var(--line2)}
.extree li:only-child::before,.extree li:only-child::after{display:none}
.extree li:first-child::before,.extree li:last-child::after{border:0 none}
.extree li:last-child::before{border-right:1.5px solid var(--line2)}
.extree ul ul::before{content:"";position:absolute;top:0;left:50%;width:0;height:22px;border-left:1.5px solid var(--line2)}
.exbox{width:162px;min-height:46px;cursor:pointer;font:inherit;font-family:var(--sans);font-size:12.5px;line-height:1.35;
  padding:9px;border-radius:var(--radius);text-align:center;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1.5px solid var(--line2);color:var(--ink)}
.exbox:hover{box-shadow:0 0 0 2px var(--phos-soft)}
.exbox:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
.exbox.finding{background:var(--success-bg);border-color:var(--success)}
.exbox.test{background:var(--surface-2);border-color:var(--border-strong)}
.exbox.tx{background:var(--info-bg);border-color:var(--info)}
.exbox.dx{background:var(--gold-soft);border-color:var(--gold);font-weight:700}
.exbox.stem{background:var(--success-bg);border-color:var(--success);font-weight:700;width:auto;padding:11px 20px;font-size:13.5px;cursor:default}
.exbox.stem:hover{box-shadow:none}
.exbox.blank{background:var(--panel);border-style:dashed;border-color:var(--border-strong);color:var(--faint);font-style:italic;font-size:12px;font-weight:400}
.exkey{display:inline-block;width:24px;height:11px;border-radius:2px;vertical-align:-1px;margin:0 5px 0 12px;border:1.5px solid}
.exkey:first-child{margin-left:0}
.exkey.f{background:var(--success-bg);border-color:var(--success)}
.exkey.t{background:var(--surface-2);border-color:var(--border-strong)}
.exkey.d{background:var(--gold-soft);border-color:var(--gold)}
.exkey.x{background:var(--info-bg);border-color:var(--info)}
.exfoot{font-size:11.5px;color:var(--faint);line-height:2;padding:2px 0 10px}
/* Phones keep the branching tree — flattening it to an outline loses exactly the
   thing these diagrams are for. Instead it opens at a scale where the shape and
   the connectors read, and tapping a box zooms in and centres it. */
@media(max-width:820px){.excanvas{padding-bottom:10px}}
/* onboarding step wizard */
.onboard.wiz{max-width:560px;margin:0 auto}
.wizhead{margin-bottom:22px}
.wizcancel{display:inline-block;margin-bottom:14px;color:var(--faint)}
.wizprog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.wizprog-bar{height:100%;background:var(--phos);border-radius:3px;transition:width .3s cubic-bezier(.4,0,.2,1)}
.wizstepn{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.wiztitle{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,6vw,30px);letter-spacing:-.015em;color:var(--ink);margin:0 0 4px}
.wizsub{font-size:14.5px;margin:0 0 20px}
.obstep{animation:obin .28s cubic-bezier(.4,0,.2,1)}
.obstep.back{animation:obinb .28s cubic-bezier(.4,0,.2,1)}
@keyframes obin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes obinb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.wizfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.wizfoot .btn{min-width:120px}
.wizfoot .btn.ghost{min-width:96px}
.wizfoot .btn.disabled{opacity:.45;pointer-events:none}
.wizhint{font-size:12.5px;color:var(--warning);text-align:right;margin:10px 0 0}
.wizreview{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.wrv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.wrv:last-child{border-bottom:0}
.wrv-k{font-size:12.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono);flex:0 0 auto}
.wrv-v{font-size:14px;color:var(--ink);text-align:right;line-height:1.4}
/* Brody weekly plan preview + Study-view week chip */
.brodywks{display:flex;flex-direction:column;gap:6px}
.brodywk{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.brodywk.heavy{border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 9%,transparent)}
.bw-n{flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--phos)}
.bw-l{flex:1;min-width:0;font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-h{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink)}
.brodychip{display:flex;align-items:center;gap:10px;background:var(--accent-bg);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:13px;color:var(--text-2)}
.brodychip b{color:var(--ink)}
.brodychip .bc-wk{flex:0 0 auto;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--phos);background:var(--phos-soft);border:1px solid var(--phos-dim);border-radius:999px;padding:3px 9px}
.brodychip.heavy{border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.brodychip .bc-heavy{flex:0 0 auto;margin-left:auto;font-size:11px;font-weight:800;color:var(--gold)}
.pacerow{display:flex;align-items:center;gap:12px;margin-top:6px}
.pacebtn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--phos);font-size:22px;font-weight:700;line-height:1;cursor:pointer;transition:all .14s}
.pacebtn:hover{border-color:var(--phos-dim);background:var(--phos-soft)}
.paceval{flex:1;text-align:center;display:flex;flex-direction:column;gap:1px}
.paceval b{font-family:var(--font-display);font-size:24px;color:var(--ink);line-height:1}
.paceval span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.catchuphd{font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--gold) 40%,transparent)}
.ordbtn[disabled]{opacity:.25;cursor:default}

/* overlay sheet (menu) */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .2s ease;overflow:auto}
.sheet{background:var(--surface-overlay);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:calc(100vh - 40px);overflow:auto;padding:8px;box-shadow:var(--shadow);animation:popIn .24s cubic-bezier(.3,1.1,.4,1)}
.sheethd{font-family:var(--mono);font-weight:700;padding:16px 14px 10px;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font-size:15px;padding:15px 14px;cursor:pointer;font-weight:600;transition:background .12s}
.mrow:hover{background:var(--accent-bg)}
.mrow.danger{color:var(--red)} .mrow.danger:hover{background:var(--danger-bg)}
.mrow.close{color:var(--muted);font-weight:700}
.chglog{padding:2px 14px 6px;display:flex;flex-direction:column;gap:18px}
.chgentry{border-left:2px solid var(--gold);padding-left:13px}
.chgdate{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--phos);margin-bottom:4px}
.chgtitle{font-family:var(--font-display,serif);font-size:17px;color:var(--ink);line-height:1.35;margin-bottom:8px}
.chglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.chglist li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.5;color:var(--text-2)}
.chglist li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.acctrow{flex-direction:column;align-items:flex-start;gap:2px;cursor:default;border-top:0}
.acctlbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.acctml{font-size:14px;color:var(--ink);font-weight:600;word-break:break-all}
.btn:disabled{opacity:.6;cursor:default;filter:saturate(.55)}
.authcard{max-width:380px;margin:0 auto;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}

   ============================================================ */
.deskonly{display:none}
@media (min-width:960px){
  /* 1-3 atmosphere: soft aurora, fine grain, gentle vignette behind all */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(1150px 660px at 50% -10%, color-mix(in srgb,var(--accent) 20%,transparent), transparent 60%),
